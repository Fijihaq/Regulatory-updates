name: Fetch Regulatory Updates

on:
  push:
    paths:
      - 'scripts/fetch_updates.py'
  schedule:
    - cron: '0 * * * *'   # Every hour
  workflow_dispatch:        # Manual trigger

jobs:
  fetch-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml

      - name: Fetch regulatory updates
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python scripts/fetch_updates.py

      - name: Warn if unknown dates detected
        run: |
          UNKNOWN=$(python3 - <<'EOF'
          import json, sys
          try:
              with open("data/regulatory-updates.json") as f:
                  data = json.load(f)
              count = data.get("unknown_dates", 0)
              total = data.get("total", 0)
              print(count)
              if count > 0:
                  pct = round(count / total * 100) if total else 0
                  print(f"::warning::⚠ {count} of {total} items ({pct}%) have no confirmed publication date — scraper date parsing may need attention", file=sys.stderr)
          except Exception as e:
              print(f"::warning::Could not read unknown_dates from JSON: {e}", file=sys.stderr)
              print(0)
          EOF
          )

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/regulatory-updates.json
          git diff --staged --quiet || git commit -m "chore: regulatory feed update [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
