name: Fetch Regulatory Updates

on:
  push:
    paths:
      - 'scripts/fetch_updates.py'
  schedule:
    - cron: '0 * * * *'   # Every hour
  workflow_dispatch:        # Manual trigger

jobs:
  fetch-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5          # Node 24 compatible

      - name: Set up Python
        uses: actions/setup-python@v6     # Node 24 compatible
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml

      - name: Fetch regulatory updates
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python scripts/fetch_updates.py

      - name: Warn if unknown dates detected
        run: |
          python3 - <<'PYEOF'
          import json, sys

          try:
              with open("data/regulatory-updates.json") as f:
                  data = json.load(f)

              total         = data.get("total", 0)
              unknown_count = data.get("unknown_dates", 0)
              items         = data.get("items", [])

              # Break down unknown dates by source so we know which scraper to fix
              unknown_by_source = {}
              for item in items:
                  if not item.get("date_confirmed"):
                      src = item.get("source", "unknown")
                      unknown_by_source[src] = unknown_by_source.get(src, 0) + 1

              if unknown_count > 0:
                  pct = round(unknown_count / total * 100) if total else 0
                  breakdown = ", ".join(
                      f"{src}: {n}" for src, n in sorted(
                          unknown_by_source.items(), key=lambda x: -x[1]
                      )
                  )
                  print(
                      f"::warning::⚠ {unknown_count} of {total} items ({pct}%) have no confirmed "
                      f"publication date. Breakdown by source → {breakdown}",
                      file=sys.stderr
                  )
              else:
                  print(f"✅  All {total} items have confirmed publication dates.")

          except Exception as e:
              print(f"::warning::Could not read unknown_dates from JSON: {e}", file=sys.stderr)
          PYEOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/regulatory-updates.json
          git diff --staged --quiet || git commit -m "chore: regulatory feed update [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
